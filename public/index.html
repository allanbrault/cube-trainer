<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two-Look OLL & PLL — 3D Cube Trainer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg: #0c0c0f;
    --panel: #141419;
    --card: #1a1a22;
    --card-hover: #22222e;
    --border: #2a2a38;
    --text: #e8e8f0;
    --text-dim: #8888a0;
    --accent: #f7c948;
    --accent-dim: #f7c94830;
    --oll-color: #f7c948;
    --pll-color: #48c9f7;
    --green: #4ade80;
    --red: #f87171;
    --radius: 10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 370px;
    min-width: 370px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    z-index: 10;
  }

  #sidebar-header {
    padding: 20px 22px 14px;
    border-bottom: 1px solid var(--border);
  }

  #sidebar-header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin-bottom: 12px;
  }

  #sidebar-header h1 span { color: var(--accent); }

  .tab-bar {
    display: flex;
    gap: 4px;
    background: var(--bg);
    border-radius: 8px;
    padding: 3px;
  }

  .tab-btn {
    flex: 1;
    padding: 8px 0;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    letter-spacing: 0.5px;
  }

  .tab-btn.active {
    background: var(--card);
    color: var(--text);
    box-shadow: 0 2px 8px #0004;
  }

  .tab-btn:hover:not(.active) { color: var(--text); }

  #alg-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .alg-section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 12px 10px 6px;
  }

  .alg-card {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 12px 14px;
    margin-bottom: 4px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all .15s;
    border: 1px solid transparent;
  }

  .alg-card:hover {
    background: var(--card-hover);
    border-color: var(--border);
  }

  .alg-card.selected {
    background: var(--accent-dim);
    border-color: var(--accent);
  }

  .alg-card.selected.pll-selected {
    background: #48c9f730;
    border-color: var(--pll-color);
  }

  .alg-mini-cube {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .alg-info { flex: 1; min-width: 0; }

  .alg-name {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 3px;
  }

  .alg-moves {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Main Area (desktop) ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  #cube-container {
    flex: 1;
    position: relative;
    cursor: grab;
  }

  #cube-container:active { cursor: grabbing; }

  #placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    pointer-events: none;
  }

  #placeholder .icon {
    width: 80px;
    height: 80px;
    border-radius: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
  }

  #placeholder p {
    color: var(--text-dim);
    font-size: 15px;
  }

  /* ── Controls Bar ── */
  #controls {
    height: 110px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 0 30px;
  }

  #alg-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
    min-height: 26px;
    text-align: center;
  }

  #alg-display .done { color: var(--text-dim); cursor: pointer; }
  #alg-display .done:hover { color: var(--text); }
  #alg-display .current { color: var(--accent); background: var(--accent-dim); padding: 1px 5px; border-radius: 4px; cursor: pointer; }
  #alg-display .pending { color: var(--text-dim); opacity: 0.5; cursor: pointer; }
  #alg-display .pending:hover { opacity: 0.8; }

  .btn-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .ctrl-btn {
    padding: 10px 22px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ctrl-btn:hover { background: var(--card-hover); border-color: var(--text-dim); }

  .ctrl-btn.primary {
    background: var(--accent);
    color: #0c0c0f;
    border-color: var(--accent);
  }

  .ctrl-btn.primary:hover { filter: brightness(1.1); }
  .ctrl-btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }

  .speed-ctrl {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .speed-ctrl input[type=range] {
    width: 80px;
    accent-color: var(--accent);
  }

  /* ── Scrollbar ── */
  #alg-list::-webkit-scrollbar { width: 6px; }
  #alg-list::-webkit-scrollbar-track { background: transparent; }
  #alg-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Mini cube SVG colors */
  .oll-yellow { fill: #f7c948; }
  .oll-gray { fill: #3a3a4a; }
  .pll-red { fill: #ef4444; }
  .pll-orange { fill: #f97316; }
  .pll-blue { fill: #3b82f6; }
  .pll-green { fill: #22c55e; }
  .pll-yellow { fill: #f7c948; }

  .alg-variants {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }

  .variant-btn {
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--bg);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }

  .variant-btn:hover {
    border-color: var(--text-dim);
    color: var(--text);
  }

  .variant-btn.active {
    border-color: var(--accent);
    background: var(--accent-dim);
    color: var(--accent);
  }

  .variant-btn.active.pll-active {
    border-color: var(--pll-color);
    background: #48c9f720;
    color: var(--pll-color);
  }

  /* ── Mobile modal close button ── */
  #modal-close {
    display: none;
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 30;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    transition: all .15s;
  }

  #modal-close:hover { background: var(--card-hover); border-color: var(--text-dim); }

  /* ── Mobile name banner in modal ── */
  #modal-alg-name {
    display: none;
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 30;
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
  }

  /* ═══ MOBILE ═══ */
  @media (max-width: 700px) {
    body { flex-direction: column; }

    #sidebar {
      width: 100%;
      min-width: 0;
      height: 100vh;
      height: 100dvh;
      border-right: none;
    }

    /* Main panel is a fullscreen modal on mobile */
    #main {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      transform: translateY(100%);
      transition: transform .3s ease;
    }

    #main.modal-open {
      transform: translateY(0);
    }

    #modal-close { display: flex; }
    #modal-alg-name { display: block; }

    #placeholder { display: none; }

    #controls {
      height: auto;
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      gap: 8px;
    }

    #alg-display {
      font-size: 14px;
      overflow-x: auto;
      white-space: nowrap;
      max-width: 100%;
    }

    .btn-row { flex-wrap: wrap; justify-content: center; }

    .ctrl-btn {
      padding: 10px 14px;
      font-size: 12px;
    }

    .speed-ctrl { order: 10; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>🧊 Two-Look <span>OLL</span> & <span>PLL</span></h1>
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="oll">OLL</button>
      <button class="tab-btn" data-tab="pll">PLL</button>
    </div>
  </div>
  <div id="alg-list"></div>
</div>

<div id="main">
  <span id="modal-alg-name"></span>
  <button id="modal-close">✕</button>
  <div id="cube-container">
    <div id="placeholder">
      <div class="icon">🎲</div>
      <p>Select an algorithm to begin</p>
    </div>
  </div>
  <div id="controls">
    <div id="alg-display"></div>
    <div class="btn-row">
      <button class="ctrl-btn" id="btn-reset" disabled>↺ Reset</button>
      <button class="ctrl-btn" id="btn-back" disabled>⏮ Back</button>
      <button class="ctrl-btn primary" id="btn-play" disabled>▶ Play</button>
      <button class="ctrl-btn" id="btn-step" disabled>⏭ Step</button>
      <div class="speed-ctrl">
        <span>Speed</span>
        <input type="range" id="speed" min="1" max="10" value="5">
      </div>
    </div>
  </div>
</div>

// ═══════════════════════════════════════════
//  MINI CUBE SVG GENERATION
// ═══════════════════════════════════════════

// Shared grid constants for both OLL and PLL icons
const ICON = {
  pad: 6,    // outside marker area
  g: 2,      // gap between cells
  cs: 10,    // cell size
  mw: 4,     // marker thickness
  mg: 1,     // marker gap from cell
};
ICON.gridSize = ICON.cs * 3 + ICON.g * 4;
ICON.total = ICON.gridSize + ICON.pad * 2;

function iconCellXY(r, c) {
  return {
    x: ICON.pad + ICON.g + c * (ICON.cs + ICON.g),
    y: ICON.pad + ICON.g + r * (ICON.cs + ICON.g),
  };
}

// Draw an outside marker on a given side of cell (r,c)
// side: 'T','B','L','R'   fillClass: CSS class or null   fillHex: hex color or null
function outsideMarker(r, c, side, fillClass, fillHex) {
  const p = iconCellXY(r, c);
  const { cs, mw, mg } = ICON;
  let rx, ry, rw, rh;
  if (side === 'T')      { rx = p.x; ry = p.y - mw - mg; rw = cs; rh = mw; }
  else if (side === 'B') { rx = p.x; ry = p.y + cs + mg;  rw = cs; rh = mw; }
  else if (side === 'L') { rx = p.x - mw - mg; ry = p.y;  rw = mw; rh = cs; }
  else if (side === 'R') { rx = p.x + cs + mg;  ry = p.y;  rw = mw; rh = cs; }
  const fill = fillHex ? `fill="${fillHex}"` : `class="${fillClass}"`;
  return `<rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" rx="1" ${fill}/>`;
}

function createOLLSvg(pattern) {
  const { total, cs } = ICON;
  let svg = `<svg width="48" height="48" viewBox="0 0 ${total} ${total}" xmlns="http://www.w3.org/2000/svg">`;

  // Detect if this is step 2 (corner orientation) — all edges oriented
  const isStep2 = pattern.edges.every(e => e === 1);

  // Center — always yellow
  const cen = iconCellXY(1, 1);
  svg += `<rect x="${cen.x}" y="${cen.y}" width="${cs}" height="${cs}" rx="2" class="oll-yellow"/>`;

  // Edges: T=0, R=1, B=2, L=3
  const edgeDefs = [
    { r:0, c:1, outside:'T' },
    { r:1, c:2, outside:'R' },
    { r:2, c:1, outside:'B' },
    { r:1, c:0, outside:'L' },
  ];
  edgeDefs.forEach((e, i) => {
    const p = iconCellXY(e.r, e.c);
    const oriented = pattern.edges[i];
    svg += `<rect x="${p.x}" y="${p.y}" width="${cs}" height="${cs}" rx="2" class="${oriented ? 'oll-yellow' : 'oll-gray'}"/>`;
    // Step 1: gray marker on unoriented edges. Step 2: gray marker on all edges.
    if (!oriented || isStep2) {
      svg += outsideMarker(e.r, e.c, e.outside, 'oll-gray', null);
    }
  });

  // Corners: [TL(UBL), TR(UBR), BR(UFR), BL(UFL)]
  const cornerPos = [[0,0],[0,2],[2,2],[2,0]];
  const cornerOutside = [
    { B:'T', F:'B', L:'L', R:'R' },
    { B:'T', F:'B', L:'L', R:'R' },
    { B:'T', F:'B', L:'L', R:'R' },
    { B:'T', F:'B', L:'L', R:'R' },
  ];
  // Each corner's two outside edges (for gray fill in step 2)
  const cornerAllOutsides = [
    ['T','L'], // TL
    ['T','R'], // TR
    ['B','R'], // BR
    ['B','L'], // BL
  ];

  cornerPos.forEach(([r,c], i) => {
    const p = iconCellXY(r, c);
    const val = pattern.corners[i];

    if (val === 'U' || val === 1) {
      // Oriented corner — yellow cell
      svg += `<rect x="${p.x}" y="${p.y}" width="${cs}" height="${cs}" rx="2" class="oll-yellow"/>`;
      if (isStep2) {
        // Gray markers on both outside edges
        cornerAllOutsides[i].forEach(side => {
          svg += outsideMarker(r, c, side, 'oll-gray', null);
        });
      }
    } else if (typeof val === 'string') {
      // Twisted corner — gray cell + yellow marker on twist side
      svg += `<rect x="${p.x}" y="${p.y}" width="${cs}" height="${cs}" rx="2" class="oll-gray"/>`;
      const yellowSide = cornerOutside[i][val];
      if (yellowSide) svg += outsideMarker(r, c, yellowSide, 'oll-yellow', null);
      // Gray markers on the other outside edge(s)
      cornerAllOutsides[i].forEach(side => {
        if (side !== yellowSide) svg += outsideMarker(r, c, side, 'oll-gray', null);
      });
    } else {
      // Step 1 corner (numeric 0) — just gray, no markers
      svg += `<rect x="${p.x}" y="${p.y}" width="${cs}" height="${cs}" rx="2" class="oll-gray"/>`;
    }
  });

  svg += '</svg>';
  return svg;
}

function createPLLSvg(colors) {
  // colors: [F-L, F-C, F-R, R-L, R-C, R-R, B-L, B-C, B-R, L-L, L-C, L-R]
  const hexMap = { r:'#ef4444', o:'#f97316', b:'#3b82f6', g:'#22c55e' };
  const { total, cs } = ICON;

  let svg = `<svg width="48" height="48" viewBox="0 0 ${total} ${total}" xmlns="http://www.w3.org/2000/svg">`;

  // All 9 cells are yellow (OLL is solved)
  for (let r = 0; r < 3; r++)
    for (let c = 0; c < 3; c++) {
      const p = iconCellXY(r, c);
      svg += `<rect x="${p.x}" y="${p.y}" width="${cs}" height="${cs}" rx="2" fill="#f7c948"/>`;
    }

  // Outside markers for side stickers
  // Front (bottom side): colors[0]=BL-corner, [1]=B-edge, [2]=BR-corner
  svg += outsideMarker(2, 0, 'B', null, hexMap[colors[0]]);
  svg += outsideMarker(2, 1, 'B', null, hexMap[colors[1]]);
  svg += outsideMarker(2, 2, 'B', null, hexMap[colors[2]]);

  // Right side: colors[3]=TR-corner, [4]=R-edge, [5]=BR-corner
  svg += outsideMarker(0, 2, 'R', null, hexMap[colors[3]]);
  svg += outsideMarker(1, 2, 'R', null, hexMap[colors[4]]);
  svg += outsideMarker(2, 2, 'R', null, hexMap[colors[5]]);

  // Back (top side, reversed): colors[6]=TR-corner, [7]=T-edge, [8]=TL-corner
  svg += outsideMarker(0, 2, 'T', null, hexMap[colors[6]]);
  svg += outsideMarker(0, 1, 'T', null, hexMap[colors[7]]);
  svg += outsideMarker(0, 0, 'T', null, hexMap[colors[8]]);

  // Left side (reversed): colors[9]=BL-corner, [10]=L-edge, [11]=TL-corner
  svg += outsideMarker(2, 0, 'L', null, hexMap[colors[9]]);
  svg += outsideMarker(1, 0, 'L', null, hexMap[colors[10]]);
  svg += outsideMarker(0, 0, 'L', null, hexMap[colors[11]]);

  svg += '</svg>';
  return svg;
}

const container = document.getElementById('cube-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setClearColor(0x0c0c0f, 1);
container.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight.position.set(5, 8, 6);
scene.add(dirLight);
const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.2);
dirLight2.position.set(-4, 2, -3);
scene.add(dirLight2);

// Colors
const COLORS = {
  U: 0xFFD500,  // yellow (top)
  D: 0xFFFFFF,  // white  (bottom)
  F: 0x009B48,  // green  (front)
  B: 0x0045AD,  // blue   (back)
  R: 0xB90000,  // red    (right)
  L: 0xFF5900,  // orange (left)
  X: 0x111111,  // internal face
  G: 0x1e1e2a   // ghost (non-relevant pieces)
};

const cubies = [];
const cubeGroup = new THREE.Group();
scene.add(cubeGroup);

let displayMode = 'full'; // 'full', 'oll', 'pll'

// ── Geometry constants ──
const BODY_SIZE = 0.93;
const GAP = 0.06;
const STEP = BODY_SIZE + GAP;
const STICKER_SIZE = 0.76;
const STICKER_OFFSET = BODY_SIZE / 2 + 0.003;

// ── Create a rounded box by shrinking a box and adding rounded-edge look ──
// We modify the vertices of a BoxGeometry to push corners/edges inward
function createRoundedBody(size, r, segs) {
  const geo = new THREE.BoxGeometry(size, size, size, segs, segs, segs);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  const half = size / 2;
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    // For each vertex, clamp the inner box and push outward
    const ix = Math.max(-half + r, Math.min(half - r, v.x));
    const iy = Math.max(-half + r, Math.min(half - r, v.y));
    const iz = Math.max(-half + r, Math.min(half - r, v.z));
    const dir = new THREE.Vector3(v.x - ix, v.y - iy, v.z - iz);
    const len = dir.length();
    if (len > 0.0001) {
      dir.normalize().multiplyScalar(r);
      v.set(ix + dir.x, iy + dir.y, iz + dir.z);
    }
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

const bodyGeo = createRoundedBody(BODY_SIZE, 0.06, 4);
const stickerGeo = new THREE.PlaneGeometry(STICKER_SIZE, STICKER_SIZE);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.9, metalness: 0 });
const ghostBodyMat = new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.9, metalness: 0 });

function getCubieColors(x, y, z) {
  // Returns [+x, -x, +y, -y, +z, -z] colors, null = no sticker
  if (displayMode === 'oll') {
    if (y === 1) {
      return [
        x === 1 ? COLORS.G : null,
        x === -1 ? COLORS.G : null,
        COLORS.U,
        null,
        z === 1 ? COLORS.G : null,
        z === -1 ? COLORS.G : null,
      ];
    }
    return [null, null, null, null, null, null];
  }
  if (displayMode === 'pll') {
    if (y === 1) {
      return [
        x === 1 ? COLORS.R : null,
        x === -1 ? COLORS.L : null,
        COLORS.U,
        null,
        z === 1 ? COLORS.F : null,
        z === -1 ? COLORS.B : null,
      ];
    }
    return [null, null, null, null, null, null];
  }
  return [
    x === 1 ? COLORS.R : null,
    x === -1 ? COLORS.L : null,
    y === 1 ? COLORS.U : null,
    y === -1 ? COLORS.D : null,
    z === 1 ? COLORS.F : null,
    z === -1 ? COLORS.B : null,
  ];
}

// Face placement: position + quaternion for each of the 6 faces
const FACE_DEFS = [
  { pos: [STICKER_OFFSET, 0, 0], rot: [0, Math.PI / 2, 0] },   // +x
  { pos: [-STICKER_OFFSET, 0, 0], rot: [0, -Math.PI / 2, 0] },  // -x
  { pos: [0, STICKER_OFFSET, 0], rot: [-Math.PI / 2, 0, 0] },   // +y
  { pos: [0, -STICKER_OFFSET, 0], rot: [Math.PI / 2, 0, 0] },   // -y
  { pos: [0, 0, STICKER_OFFSET], rot: [0, 0, 0] },              // +z
  { pos: [0, 0, -STICKER_OFFSET], rot: [0, Math.PI, 0] },       // -z
];

function buildCube() {
  while (cubeGroup.children.length) cubeGroup.remove(cubeGroup.children[0]);
  cubies.length = 0;

  for (let x = -1; x <= 1; x++) {
    for (let y = -1; y <= 1; y++) {
      for (let z = -1; z <= 1; z++) {
        if (x === 0 && y === 0 && z === 0) continue;

        const group = new THREE.Group();
        group.position.set(x * STEP, y * STEP, z * STEP);
        group.userData = { lx: x, ly: y, lz: z };

        const isGhost = displayMode !== 'full' && y !== 1;

        // Dark body
        const body = new THREE.Mesh(bodyGeo, isGhost ? ghostBodyMat : bodyMat);
        group.add(body);

        // Colored stickers
        const colors = getCubieColors(x, y, z);
        colors.forEach((col, fi) => {
          if (col === null) return;
          const mat = new THREE.MeshStandardMaterial({
            color: col, roughness: 0.85, metalness: 0, side: THREE.DoubleSide
          });
          const sticker = new THREE.Mesh(stickerGeo, mat);
          const fd = FACE_DEFS[fi];
          sticker.position.set(...fd.pos);
          sticker.rotation.set(...fd.rot);
          group.add(sticker);
        });

        cubeGroup.add(group);
        cubies.push(group);
      }
    }
  }
}

buildCube();

// ═══════════════════════════════════════════
//  ORBIT CONTROLS (simple mouse drag)
// ═══════════════════════════════════════════

let isDragging = false, prevMouse = { x:0, y:0 };

// Compute a radius so the cube fits nicely with padding
function computeFitRadius() {
  const cubeHalfSize = 1.8; // ~visible half-extent of the 3x3 cube
  const fovRad = THREE.MathUtils.degToRad(camera.fov / 2);
  const aspect = container.clientWidth / container.clientHeight;
  const rVert = cubeHalfSize / Math.sin(fovRad);
  const rHoriz = cubeHalfSize / (Math.sin(fovRad) * aspect);
  return Math.max(rVert, rHoriz) * 1.45; // 45% padding
}

// Standard "in hand" view: see U (top), F (front), R (right) clearly
// This is the correct angle for executing R U F moves visually
const HOME_THETA = 0.62;  // ~35° from front — shows F and R faces
const HOME_PHI = 0.48;    // ~27° above — shows U face prominently

let spherical = { theta: HOME_THETA, phi: HOME_PHI, radius: computeFitRadius() };

function updateCamera() {
  camera.position.set(
    spherical.radius * Math.cos(spherical.phi) * Math.sin(spherical.theta),
    spherical.radius * Math.sin(spherical.phi),
    spherical.radius * Math.cos(spherical.phi) * Math.cos(spherical.theta)
  );
  camera.lookAt(0, 0, 0);
}

function resetCameraPosition(animate = true) {
  const targetTheta = HOME_THETA;
  const targetPhi = HOME_PHI;
  const targetRadius = computeFitRadius();

  if (!animate) {
    spherical.theta = targetTheta;
    spherical.phi = targetPhi;
    spherical.radius = targetRadius;
    updateCamera();
    return;
  }

  const startTheta = spherical.theta;
  const startPhi = spherical.phi;
  const startRadius = spherical.radius;
  const duration = 350;
  const startTime = performance.now();

  function tick() {
    const t = Math.min((performance.now() - startTime) / duration, 1);
    const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    spherical.theta = startTheta + (targetTheta - startTheta) * ease;
    spherical.phi = startPhi + (targetPhi - startPhi) * ease;
    spherical.radius = startRadius + (targetRadius - startRadius) * ease;
    updateCamera();
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

updateCamera();

container.addEventListener('pointerdown', e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
window.addEventListener('pointerup', () => { isDragging = false; });
window.addEventListener('pointermove', e => {
  if (!isDragging) return;
  const dx = e.clientX - prevMouse.x, dy = e.clientY - prevMouse.y;
  spherical.theta -= dx * 0.008;
  spherical.phi = Math.max(-1.2, Math.min(1.2, spherical.phi + dy * 0.008));
  prevMouse = { x: e.clientX, y: e.clientY };
  updateCamera();
});

// Scroll to zoom
container.addEventListener('wheel', e => {
  e.preventDefault();
  spherical.radius = Math.max(4, Math.min(30, spherical.radius + e.deltaY * 0.01));
  updateCamera();
}, { passive: false });

// ═══════════════════════════════════════════
//  MOVE SYSTEM
// ═══════════════════════════════════════════

function getCubiesForMove(axis, layers) {
  const key = axis === 'x' ? 'lx' : axis === 'y' ? 'ly' : 'lz';
  return cubies.filter(c => layers.includes(c.userData[key]));
}

// Returns { axis, layers[], angle }
function parseMove(token) {
  const moves = {
    'R':  { axis:'x', layers:[1],      angle: -Math.PI/2 },
    'L':  { axis:'x', layers:[-1],     angle:  Math.PI/2 },
    'U':  { axis:'y', layers:[1],      angle: -Math.PI/2 },
    'D':  { axis:'y', layers:[-1],     angle:  Math.PI/2 },
    'F':  { axis:'z', layers:[1],      angle: -Math.PI/2 },
    'B':  { axis:'z', layers:[-1],     angle:  Math.PI/2 },
    'M':  { axis:'x', layers:[0],      angle:  Math.PI/2 },
    'E':  { axis:'y', layers:[0],      angle:  Math.PI/2 },
    'S':  { axis:'z', layers:[0],      angle: -Math.PI/2 },
    'r':  { axis:'x', layers:[1,0],    angle: -Math.PI/2 },
    'l':  { axis:'x', layers:[-1,0],   angle:  Math.PI/2 },
    'u':  { axis:'y', layers:[1,0],    angle: -Math.PI/2 },
    'd':  { axis:'y', layers:[-1,0],   angle:  Math.PI/2 },
    'f':  { axis:'z', layers:[1,0],    angle: -Math.PI/2 },
    'b':  { axis:'z', layers:[-1,0],   angle:  Math.PI/2 },
    'x':  { axis:'x', layers:[-1,0,1], angle: -Math.PI/2 },
    'y':  { axis:'y', layers:[-1,0,1], angle: -Math.PI/2 },
    'z':  { axis:'z', layers:[-1,0,1], angle: -Math.PI/2 },
  };

  let base = token[0];
  let rest = token.slice(1);
  let move = moves[base];
  if (!move) return null;

  let { axis, layers, angle } = move;
  layers = [...layers];

  if (rest.includes("'")) angle = -angle;
  if (rest.includes('2')) angle *= 2;

  return { axis, layers, angle };
}

function tokenize(algStr) {
  const tokens = [];
  const re = /([RLUDFBMESxyz]|[rludfb])['2]?/g;
  let m;
  while ((m = re.exec(algStr)) !== null) tokens.push(m[0]);
  return tokens;
}

// ═══════════════════════════════════════════
//  ANIMATION ENGINE
// ═══════════════════════════════════════════

let animating = false;
const pivot = new THREE.Group();
scene.add(pivot);

function roundPos(v) {
  return Math.round(v * 10) / 10;
}

function animateMove(move, duration) {
  return new Promise(resolve => {
    if (!move) { resolve(); return; }

    const affected = getCubiesForMove(move.axis, move.layers);
    const axisVec = new THREE.Vector3(
      move.axis === 'x' ? 1 : 0,
      move.axis === 'y' ? 1 : 0,
      move.axis === 'z' ? 1 : 0
    );

    // Move cubies to pivot
    pivot.rotation.set(0, 0, 0);
    pivot.updateMatrixWorld();
    affected.forEach(c => {
      cubeGroup.remove(c);
      pivot.add(c);
    });

    const startAngle = 0;
    const endAngle = move.angle;
    const startTime = performance.now();

    function tick() {
      const elapsed = performance.now() - startTime;
      const t = Math.min(elapsed / duration, 1);
      // Ease in-out
      const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const currentAngle = startAngle + (endAngle - startAngle) * eased;

      if (move.axis === 'x') pivot.rotation.x = currentAngle;
      else if (move.axis === 'y') pivot.rotation.y = currentAngle;
      else pivot.rotation.z = currentAngle;

      if (t < 1) {
        requestAnimationFrame(tick);
      } else {
        // Finalize: bake rotation into cubies, move back
        pivot.updateMatrixWorld();
        affected.forEach(c => {
          // Get world position/rotation
          const wp = new THREE.Vector3();
          c.getWorldPosition(wp);
          const wq = new THREE.Quaternion();
          c.getWorldQuaternion(wq);

          pivot.remove(c);
          c.position.copy(wp);
          c.quaternion.copy(wq);
          cubeGroup.add(c);

          // Update logical position
          const lp = new THREE.Vector3(c.userData.lx, c.userData.ly, c.userData.lz);
          // Rotate logical position
          const q = new THREE.Quaternion().setFromAxisAngle(axisVec, endAngle);
          lp.applyQuaternion(q);
          c.userData.lx = Math.round(lp.x);
          c.userData.ly = Math.round(lp.y);
          c.userData.lz = Math.round(lp.z);
        });

        pivot.rotation.set(0, 0, 0);
        resolve();
      }
    }
    requestAnimationFrame(tick);
  });
}

let currentAlg = null;
let moveTokens = [];
let moveIndex = 0;
let playing = false;

const algDisplay = document.getElementById('alg-display');
const btnPlay = document.getElementById('btn-play');

function isMobile() { return window.innerWidth <= 700; }

function openMobileModal() {
  mainEl.classList.add('modal-open');

  setTimeout(resizeRenderer, 50);
  setTimeout(resizeRenderer, 350);
}

  mainEl.classList.remove('modal-open');

  updateButtons();
}

function resizeRenderer() {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
  spherical.radius = computeFitRadius();
  updateCamera();
}

function getMoveDuration() {
  const v = parseInt(speedSlider.value);
  return 600 - (v - 1) * 55; // 600ms to 105ms
}

function updateDisplay() {
  if (!moveTokens.length) { algDisplay.innerHTML = ''; return; }
  let html = '';
  moveTokens.forEach((tok, i) => {
    const cls = i < moveIndex ? 'done' : i === moveIndex ? 'current' : 'pending';
    html += `<span class="${cls}" data-step="${i}">${tok}</span> `;
  });
  algDisplay.innerHTML = html;

  // Attach click handlers
  algDisplay.querySelectorAll('span[data-step]').forEach(span => {
    span.addEventListener('click', () => {
      const target = parseInt(span.dataset.step);
      goToStep(target);
    });
  });
}

async function goToStep(targetIndex) {
  if (animating || targetIndex === moveIndex) return;
  playing = false;
  animating = true;
  updateButtons();

  const fastDuration = Math.min(getMoveDuration(), 200);

  if (targetIndex > moveIndex) {
    // Animate forward
    while (moveIndex < targetIndex && moveIndex < moveTokens.length) {
      const move = parseMove(moveTokens[moveIndex]);
      await animateMove(move, fastDuration);
      moveIndex++;
      updateDisplay();
    }
  } else {
    // Animate backward
    while (moveIndex > targetIndex) {
      moveIndex--;
      const tok = moveTokens[moveIndex];
      let inverseTok;
      if (tok.endsWith("'")) inverseTok = tok.slice(0, -1);
      else if (tok.endsWith('2')) inverseTok = tok;
      else inverseTok = tok + "'";
      const move = parseMove(inverseTok);
      await animateMove(move, fastDuration);
      updateDisplay();
    }
  }

  animating = false;
  updateDisplay();
  updateButtons();
}

function updateButtons() {
  const done = moveIndex >= moveTokens.length;
  btnPlay.disabled = !currentAlg || animating;
  btnStep.disabled = !currentAlg || done || animating;
  btnBack.disabled = !currentAlg || moveIndex === 0 || animating;
  btnReset.disabled = !currentAlg || animating;
  btnPlay.innerHTML = playing ? '⏸ Pause' : (done ? '▶ Replay' : '▶ Play');
}

async function doStepBack() {
  if (moveIndex <= 0 || animating) return;
  animating = true;
  playing = false;
  updateButtons();

  moveIndex--;
  // Apply the inverse of the move we're undoing
  const tok = moveTokens[moveIndex];
  let inverseTok;
  if (tok.endsWith("'")) inverseTok = tok.slice(0, -1);
  else if (tok.endsWith('2')) inverseTok = tok;
  else inverseTok = tok + "'";

  const move = parseMove(inverseTok);
  await animateMove(move, getMoveDuration());
  animating = false;
  updateDisplay();
  updateButtons();
}

async function doStep() {
  if (moveIndex >= moveTokens.length || animating) return;
  animating = true;
  updateButtons();

  const move = parseMove(moveTokens[moveIndex]);
  await animateMove(move, getMoveDuration());
  moveIndex++;
  animating = false;
  updateDisplay();
  updateButtons();
}

async function playAll() {
  if (moveIndex >= moveTokens.length) {
    // Reset first for replay
    resetCube();
    await new Promise(r => setTimeout(r, 200));
  }
  playing = true;
  updateButtons();
  while (playing && moveIndex < moveTokens.length) {
    await doStep();
    if (moveIndex < moveTokens.length) await new Promise(r => setTimeout(r, 80));
  }
  playing = false;
  updateButtons();
}

function resetCube() {
  playing = false;
  animating = false;
  moveTokens = tokenize(getAlgString(currentAlg));
  moveIndex = 0;
  buildCube();
  applySetup();
  resetCameraPosition(true);
  updateDisplay();
  updateButtons();
}

function applySetup() {
  // Apply the inverse of the algorithm instantly so the cube shows the OLL/PLL case
  const inverse = getInverse(moveTokens);
  inverse.forEach(tok => {
    const move = parseMove(tok);
    if (!move) return;
    const affected = getCubiesForMove(move.axis, move.layers);
    const axisVec = new THREE.Vector3(
      move.axis === 'x' ? 1 : 0,
      move.axis === 'y' ? 1 : 0,
      move.axis === 'z' ? 1 : 0
    );
    const q = new THREE.Quaternion().setFromAxisAngle(axisVec, move.angle);

    affected.forEach(c => {
      // Rotate position
      c.position.applyQuaternion(q);
      c.position.x = Math.round(c.position.x * 100) / 100;
      c.position.y = Math.round(c.position.y * 100) / 100;
      c.position.z = Math.round(c.position.z * 100) / 100;
      // Rotate orientation
      c.quaternion.premultiply(q);
      // Update logical
      const lp = new THREE.Vector3(c.userData.lx, c.userData.ly, c.userData.lz);
      lp.applyQuaternion(q);
      c.userData.lx = Math.round(lp.x);
      c.userData.ly = Math.round(lp.y);
      c.userData.lz = Math.round(lp.z);
    });
  });
}

function getInverse(tokens) {
  return [...tokens].reverse().map(tok => {
    if (tok.endsWith("'")) return tok.slice(0, -1);
    if (tok.endsWith('2')) return tok;
    return tok + "'";
  });
}

function selectAlg(alg, cardEl) {
  if (selectedCard) selectedCard.classList.remove('selected', 'pll-selected');
  cardEl.classList.add('selected');
  if (currentTab === 'pll') cardEl.classList.add('pll-selected');
  selectedCard = cardEl;

  placeholder.style.display = 'none';
  currentAlg = alg;
  displayMode = currentTab; // 'oll' or 'pll'
  moveTokens = tokenize(getAlgString(alg));
  moveIndex = 0;
  playing = false;
  animating = false;

  buildCube();
  applySetup();
  updateDisplay();
  updateButtons();

  // Mobile: open modal, then reset camera after layout settles
  if (isMobile()) {
    modalAlgName.textContent = alg.name;
    openMobileModal();
    setTimeout(() => resetCameraPosition(false), 100);
    setTimeout(() => resetCameraPosition(false), 400);
  } else {
    resetCameraPosition(true);
  }
}

btnPlay.addEventListener('click', () => {
  if (playing) { playing = false; updateButtons(); }
  else playAll();
});
btnStep.addEventListener('click', doStep);
btnBack.addEventListener('click', doStepBack);
btnReset.addEventListener('click', resetCube);

// ═══════════════════════════════════════════
//  RENDER LOOP
// ═══════════════════════════════════════════

function render() {
  requestAnimationFrame(render);
  renderer.render(scene, camera);
}
render();

window.addEventListener('resize', resizeRenderer);
</script>
</body>
</html>
