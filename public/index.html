<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<title>Two-Look OLL & PLL — 3D Cube Trainer</title>
<meta name="description" content="Learn beginner two-look OLL and PLL on an interactive 3D Rubik's cube: pick a case, choose an algorithm, and step through it move by move.">
<meta name="theme-color" content="#0c0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cube Trainer">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://cube.lyuz.net/">
<meta property="og:title" content="Two-Look OLL & PLL — 3D Cube Trainer">
<meta property="og:description" content="Pick a case, choose an algorithm, and step through it move by move on an interactive 3D cube.">
<meta property="og:image" content="https://cube.lyuz.net/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  /* No double-tap zoom anywhere (fast taps on Step used to zoom on iOS) */
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; background: var(--bg); }
  button, .alg-card { -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0c0c0f;
    --panel: #141419;
    --card: #1a1a22;
    --card-hover: #22222e;
    --border: #2a2a38;
    --text: #e8e8f0;
    --text-dim: #8888a0;
    --accent: #f7c948;
    --accent-dim: #f7c94830;
    --oll-color: #f7c948;
    --pll-color: #48c9f7;
    --green: #4ade80;
    --red: #f87171;
    --radius: 10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
  }

  /* ── Sidebar ── */
  #sidebar {
    padding-left: env(safe-area-inset-left);
    width: 370px;
    min-width: 370px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    z-index: 10;
  }

  #sidebar-header {
    padding: 20px 22px 14px;
    border-bottom: 1px solid var(--border);
  }

  #sidebar-header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin-bottom: 12px;
  }

  #sidebar-header h1 span { color: var(--accent); }

  .tab-bar {
    display: flex;
    gap: 4px;
    background: var(--bg);
    border-radius: 8px;
    padding: 3px;
  }

  .tab-btn {
    flex: 1;
    padding: 8px 0;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    letter-spacing: 0.5px;
  }

  .tab-btn.active {
    background: var(--card);
    color: var(--text);
    box-shadow: 0 2px 8px #0004;
  }

  @media (hover: hover) { .tab-btn:hover:not(.active) { color: var(--text); } }

  #alg-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .alg-section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 12px 10px 6px;
  }

  .alg-card {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 12px 14px;
    margin-bottom: 4px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all .15s;
    border: 1px solid transparent;
  }

  @media (hover: hover) {
    .alg-card:hover {
      background: var(--card-hover);
      border-color: var(--border);
    }
  }

  .alg-card.selected {
    background: var(--accent-dim);
    border-color: var(--accent);
  }

  .alg-card.selected.pll-selected {
    background: #48c9f730;
    border-color: var(--pll-color);
  }

  .alg-mini-cube {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .alg-info { flex: 1; min-width: 0; }

  .alg-name {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 3px;
  }

  .alg-moves {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Main Area (desktop) ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  #cube-container {
    flex: 1;
    position: relative;
    cursor: grab;
    touch-action: none;
  }

  #cube-container:active { cursor: grabbing; }

  #placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 24px;
    pointer-events: none;
  }

  #placeholder p {
    color: var(--text-dim);
    font-size: 15px;
  }

  /* ── Controls Bar ── */
  #controls {
    min-height: 110px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px calc(30px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) 30px;
    user-select: none;
    -webkit-user-select: none;
  }

  #alg-display {
    position: relative;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
    min-height: 26px;
    text-align: center;
  }

  #alg-display .done { color: var(--text-dim); cursor: pointer; }
  @media (hover: hover) { #alg-display .done:hover { color: var(--text); } }
  #alg-display .current { color: var(--accent); background: var(--accent-dim); padding: 1px 5px; border-radius: 4px; cursor: pointer; }
  #alg-display .pending { color: var(--text-dim); opacity: 0.5; cursor: pointer; }
  @media (hover: hover) { #alg-display .pending:hover { opacity: 0.8; } }

  .btn-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    align-items: center;
  }

  .ctrl-btn {
    padding: 10px 22px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  @media (hover: hover) { .ctrl-btn:hover { background: var(--card-hover); border-color: var(--text-dim); } }

  .ctrl-btn.primary {
    background: var(--accent);
    color: #0c0c0f;
    border-color: var(--accent);
  }

  @media (hover: hover) { .ctrl-btn.primary:hover { filter: brightness(1.1); } }
  .ctrl-btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }

  .speed-ctrl {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .speed-ctrl input[type=range] {
    width: 80px;
    accent-color: var(--accent);
  }

  /* ── Scrollbar ── */
  #alg-list::-webkit-scrollbar { width: 6px; }
  #alg-list::-webkit-scrollbar-track { background: transparent; }
  #alg-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Mini cube SVG colors */
  .oll-yellow { fill: #f7c948; }
  .oll-gray { fill: #3a3a4a; }

  .alg-variants {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }

  .variant-btn {
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--bg);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }

  @media (hover: hover) {
    .variant-btn:hover {
      border-color: var(--text-dim);
      color: var(--text);
    }
  }

  .variant-btn.active {
    border-color: var(--accent);
    background: var(--accent-dim);
    color: var(--accent);
  }

  .fav-btn {
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
  }
  .fav-btn.on { color: var(--accent); border-color: var(--accent); }

  .variant-btn.active.pll-active {
    border-color: var(--pll-color);
    background: #48c9f720;
    color: var(--pll-color);
  }

  /* ── Case stats on the list ── */
  .alg-name-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 3px;
  }
  .alg-name-row .alg-name { margin-bottom: 0; }

  .badge {
    flex-shrink: 0;
    padding: 2px 8px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    white-space: nowrap;
  }
  .badge.slow { color: var(--red); background: #f8717122; border: 1px solid #f8717166; }
  .badge.reps { color: var(--accent); background: var(--accent-dim); border: 1px solid #f7c94866; }
  .badge.off { color: var(--text-dim); border: 1px solid var(--border); }

  .case-foot {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }
  .case-stats {
    flex: 1 1 100%;
    min-width: 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chip-btn {
    flex-shrink: 0;
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: transparent;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip-btn.time { color: var(--text); }
  .alg-card.excluded .alg-mini-cube, .alg-card.excluded .alg-name { opacity: .45; }

  #focus-banner {
    margin: 0 10px 4px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-dim);
  }
  #focus-banner b { color: var(--text); font-weight: 600; }
  #focus-banner:empty { display: none; }

  #btn-timer {
    width: 100%;
    margin-top: 10px;
    padding: 10px 0;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: var(--accent-dim);
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
  }

  /* ── Timer ── */
  #trainer {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 20;
    flex-direction: column;
    gap: 14px;
    padding: 24px calc(28px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) 28px;
    background: var(--bg);
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
    overflow: hidden;
  }
  #main.trainer-mode #trainer { display: flex; }

  .tr-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .seg {
    display: flex;
    gap: 4px;
    padding: 3px;
    border-radius: 8px;
    background: var(--panel);
  }
  .seg button {
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .seg button.active { background: var(--card); color: var(--text); box-shadow: 0 2px 8px #0004; }

  #tr-focus {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  #tr-focus.on { display: flex; }

  .tr-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  #tr-scramble {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 600;
    line-height: 1.5;
    word-spacing: 4px;
  }

  #tr-hint {
    display: none;
    align-items: center;
    gap: 14px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--panel);
  }
  #tr-hint.on { display: flex; }
  #tr-hint svg { width: 72px; height: 72px; flex-shrink: 0; }
  #tr-hint .name { font-weight: 600; }
  #tr-hint .alg { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  #tr-pad {
    flex: 1;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-radius: 16px;
    cursor: pointer;
  }

  #tr-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(56px, 14vw, 104px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    transition: color .1s;
  }
  #trainer.holding #tr-time { color: var(--red); }
  #trainer.ready #tr-time { color: var(--green); }
  #tr-help { font-size: 13px; color: var(--text-dim); text-align: center; }

  /* While solving, only the time is shown */
  #main.timing #modal-close, #main.timing #modal-alg-name { visibility: hidden; }
  #trainer.running > :not(#tr-pad) { visibility: hidden; }
  #trainer.running #tr-help { visibility: hidden; }

  #tr-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .stat {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
  }
  .stat .v { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; margin-top: 2px; }

  #tr-recent { display: flex; flex-direction: column; gap: 2px; max-height: 150px; overflow-y: auto; }
  .solve-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 4px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .solve-row .t { font-family: 'JetBrains Mono', monospace; font-weight: 700; width: 64px; }
  .solve-row .c { flex: 1; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .solve-row button {
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 14px;
    padding: 4px 8px;
    cursor: pointer;
  }

  /* ── Mobile modal close button ── */
  #modal-close {
    display: none;
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 30;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    transition: all .15s;
  }

  @media (hover: hover) { #modal-close:hover { background: var(--card-hover); border-color: var(--text-dim); } }

  /* ── Mobile name banner in modal ── */
  #modal-alg-name {
    display: none;
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 30;
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
  }

  /* ═══ SHORT LANDSCAPE (phone on its side) ═══ */
  @media (min-width: 701px) and (max-height: 500px) {
    #sidebar { width: 300px; min-width: 300px; }
    #sidebar-header { padding: 10px 14px 8px; }
    #sidebar-header h1 { font-size: 15px; margin-bottom: 8px; }
    #controls { height: auto; padding: 8px 16px; gap: 6px; }
    #alg-display { font-size: 14px; overflow-x: auto; white-space: nowrap; max-width: 100%; }
    .ctrl-btn { padding: 8px 14px; }
  }

  /* ═══ MOBILE ═══ */
  @media (max-width: 700px) {
    /* The list scrolls the page itself, so iOS Safari can shrink its
       toolbar and run edge to edge; the open modal locks it again */
    body { display: block; height: auto; overflow: visible; }
    body.modal-lock { overflow: hidden; }

    #sidebar {
      width: 100%;
      min-width: 0;
      height: auto;
      min-height: 100dvh;
      padding-left: 0;
      border-right: none;
    }

    #sidebar-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--panel);
      padding: calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px) 12px calc(env(safe-area-inset-left) + 16px);
    }
    #sidebar-header h1 { margin-bottom: 10px; }

    #alg-list {
      flex: none;
      overflow: visible;
      padding: 12px calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 10px);
    }

    /* Main panel is a fullscreen modal on mobile */
    #main {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      transform: translateY(100%);
      transition: transform .3s ease;
    }

    #main.modal-open {
      transform: translateY(0);
    }

    #modal-close {
      display: flex;
      top: calc(env(safe-area-inset-top) + 10px);
      right: calc(env(safe-area-inset-right) + 12px);
    }
    #modal-alg-name {
      display: block;
      top: calc(env(safe-area-inset-top) + 14px);
      left: calc(env(safe-area-inset-left) + 14px);
      max-width: calc(100% - 90px - env(safe-area-inset-left) - env(safe-area-inset-right));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #modal-close { width: 44px; height: 44px; }

    .tab-btn { padding: 11px 0; font-size: 13px; }
    .variant-btn { padding: 7px 11px; font-size: 11px; }

    #placeholder { display: none; }

    #controls {
      height: auto;
      padding: 12px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 16px);
      gap: 8px;
    }

    #alg-display {
      font-size: 15px;
      line-height: 2;
      overflow-x: auto;
      white-space: nowrap;
      max-width: 100%;
      scrollbar-width: none;
    }
    #alg-display::-webkit-scrollbar { display: none; }

    .btn-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: 100%;
    }

    .ctrl-btn {
      justify-content: center;
      white-space: nowrap;
      min-height: 46px;
      padding: 0 6px;
      font-size: 13px;
    }

    .speed-ctrl {
      grid-column: 1 / -1;
      justify-content: center;
      min-height: 32px;
    }
    .speed-ctrl input[type=range] { width: 160px; }

    .chip-btn { padding: 7px 10px; font-size: 11px; }
    .fav-btn { padding: 6px 11px; font-size: 14px; }
    .badge { padding: 3px 9px; font-size: 11px; }
    #btn-timer { padding: 13px 0; font-size: 14px; }

    #trainer {
      gap: 12px;
      padding: calc(env(safe-area-inset-top) + 66px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 16px);
    }
    .seg { flex: 1; }
    .seg button { flex: 1; padding: 10px 0; font-size: 13px; }
    #tr-scramble { font-size: 19px; }
    #tr-exit { display: none; }
    #tr-stats { gap: 6px; }
    .stat { padding: 6px 8px; }
    .stat .v { font-size: 14px; }
    #tr-recent { max-height: 104px; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>🧊 Two-Look <span>OLL</span> & <span>PLL</span></h1>
    <div class="tab-bar">

const ALGS_BY_TAB = { oll: OLL_ALGS, pll: PLL_ALGS };
const isTab = tab => Object.hasOwn(ALGS_BY_TAB, tab);
const slug = str => str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

const ALG_BY_KEY = {};
for (const [tab, data] of Object.entries(ALGS_BY_TAB))
  data.forEach((section, si) => section.algs.forEach(alg => {
    alg.tab = tab;
    alg.step = si + 1; // 1 = first look (OLL edges / PLL corners), 2 = second look
    alg.edgesOnly = !!section.edgesOnly;
    alg.key = `${tab}/${slug(alg.name)}`;
    ALG_BY_KEY[alg.key] = alg;
  }));

// Shareable link: #oll/sune or #pll/adj-corner-swap/j-perm-b
function linkFor(alg, vi) {
  // Name the variant whenever it isn't plain variant 0, so links don't depend on favorites
  const named = vi || store.favorites[alg.key];
  return `#${alg.key}` + (named ? `/${slug(alg.variants[vi].label)}` : '');
}

// Saved per browser: every timed solve, cases left out of scrambles,
// last timer mode and last opened case
const STORE_KEY = 'cube-trainer-v2';

function loadStore() {
  const empty = { solves: [], excluded: {}, favorites: {}, mode: 'oll', last: null };
  try { return { ...empty, ...JSON.parse(localStorage.getItem(STORE_KEY) || '{}') }; }
  catch { return empty; }
}
const store = loadStore();

function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch {}
}

// Truncated to the hundredth, as on a competition display (9.999 is 9.99, not 10.00)
const fmtTime = ms => (Math.floor(ms / 10) / 100).toFixed(2);
const mean = xs => xs.reduce((a, b) => a + b, 0) / xs.length;

// Average of the last n with best and worst dropped (the cubing "ao5/ao12")
function aoN(times, n) {
  if (times.length < n) return null;
  const sorted = times.slice(-n).sort((a, b) => a - b);
  return mean(sorted.slice(1, -1));
}

const isIncluded = alg => !store.excluded[alg.key];

// Favorite variant per case (stored by label slug): loads first when the case opens
function defaultVariant(alg) {
  const i = alg.variants.findIndex(v => slug(v.label) === store.favorites[alg.key]);
  return i >= 0 ? i : 0;
}
const isFavorite = (alg, vi) => store.favorites[alg.key] === slug(alg.variants[vi].label);

// Per-case stats come from OLL-only / PLL-only solves, where the starting
// case is known; in OLL + PLL the PLL you get depends on how you solved OLL
const MIN_SOLVES = 3;

function caseStats(alg) {
  const times = store.solves.filter(sv => sv.mode !== 'll' && sv.case === alg.key).map(sv => sv.ms);
  return {
    count: times.length,
    best: times.length ? Math.min(...times) : null,
    avg: times.length ? mean(times.slice(-5)) : null, // mean of the last 5
  };
}

// Which cases of a tab need work: too few solves, or among the slowest third
function focusFor(tab) {
  const algs = ALGS_BY_TAB[tab].flatMap(section => section.algs).filter(isIncluded);
  const stats = new Map(algs.map(a => [a, caseStats(a)]));
  const rated = algs.filter(a => stats.get(a).count >= MIN_SOLVES)
    .sort((a, b) => stats.get(b).avg - stats.get(a).avg);
  const slow = rated.length >= 2 ? rated.slice(0, Math.max(1, Math.floor(rated.length / 3))) : [];
  // Nudge for reps only once this tab has been timed at all
  const started = algs.some(a => stats.get(a).count > 0);
  const reps = started ? algs.filter(a => stats.get(a).count < MIN_SOLVES) : [];
  return { stats, slow: new Set(slow), reps: new Set(reps) };
}

// ═══════════════════════════════════════════
//  MINI CUBE SVG GENERATION
// ═══════════════════════════════════════════

// Shared grid constants for both OLL and PLL icons
const ICON = {
  pad: 6,    // outside marker area
  g: 2,      // gap between cells
  cs: 10,    // cell size
  mw: 5,     // marker thickness
  mg: 1,     // marker gap from cell
};
ICON.gridSize = ICON.cs * 3 + ICON.g * 4;
ICON.total = ICON.gridSize + ICON.pad * 2;

function iconCellXY(r, c) {
  return {
    x: ICON.pad + ICON.g + c * (ICON.cs + ICON.g),
    y: ICON.pad + ICON.g + r * (ICON.cs + ICON.g),
  };
}

// Draw an outside marker on a given side of cell (r,c)
// side: 'T','B','L','R'   fillClass: CSS class or null   fillHex: hex color or null
function outsideMarker(r, c, side, fillClass, fillHex) {
  const p = iconCellXY(r, c);
  const { cs, mw, mg } = ICON;
  let rx, ry, rw, rh;
  if (side === 'T')      { rx = p.x; ry = p.y - mw - mg; rw = cs; rh = mw; }
  else if (side === 'B') { rx = p.x; ry = p.y + cs + mg;  rw = cs; rh = mw; }
  else if (side === 'L') { rx = p.x - mw - mg; ry = p.y;  rw = mw; rh = cs; }
  else if (side === 'R') { rx = p.x + cs + mg;  ry = p.y;  rw = mw; rh = cs; }
  const fill = fillHex ? `fill="${fillHex}"` : `class="${fillClass}"`;
  return `<rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" rx="1" ${fill}/>`;
}

// ── Sticker model: replays the setup (inverse alg) on a solved cube so the
//    icon always shows exactly the case the 3D cube will show ──
const FACE_NORMALS = { R:[1,0,0], L:[-1,0,0], U:[0,1,0], D:[0,-1,0], F:[0,0,1], B:[0,0,-1] };
// Outside sides of the top-down icon: T = back, B = front
const SIDE_NORMALS = { T:[0,0,-1], B:[0,0,1], L:[-1,0,0], R:[1,0,0] };

// Rotate an integer vector by q quarter turns (right-handed, like THREE)
function rotQuarter(v, axis, q) {
  let [x, y, z] = v;
  for (let i = 0; i < ((q % 4) + 4) % 4; i++) {
    if (axis === 'x') [y, z] = [-z, y];
    else if (axis === 'y') [z, x] = [-x, z];
    else [x, y] = [-y, x];
  }
  return [x, y, z];
}

// Returns sticker(r, c, side): face letter of the top-layer sticker at icon
// cell (r,c) — side 'U' for the top sticker, or 'T'/'B'/'L'/'R' for the side one
function topLayerFor(algStr) {
  const stickers = [];
  for (let x = -1; x <= 1; x++)
    for (let y = -1; y <= 1; y++)
      for (let z = -1; z <= 1; z++)
        for (const [face, n] of Object.entries(FACE_NORMALS))
          if (n[0] * x + n[1] * y + n[2] * z === 1) stickers.push({ p: [x, y, z], n, face });

  getInverse(tokenize(algStr)).forEach(tok => {
    const move = parseMove(tok);
    const k = { x: 0, y: 1, z: 2 }[move.axis];
    const q = Math.round(move.angle / (Math.PI / 2));
    stickers.forEach(s => {
      if (!move.layers.includes(s.p[k])) return;
      s.p = rotQuarter(s.p, move.axis, q);
      s.n = rotQuarter(s.n, move.axis, q);
    });
  });

  return (r, c, side) => {
    const p = [c - 1, 1, r - 1];
    const n = side === 'U' ? FACE_NORMALS.U : SIDE_NORMALS[side];
    return stickers.find(s => s.p + '' === p + '' && s.n + '' === n + '').face;
  };
}

// Outside sides of icon cell (r,c)
function outsideSides(r, c) {
  const sides = [];
  if (r === 0) sides.push('T');
  if (r === 2) sides.push('B');
  if (c === 0) sides.push('L');
  if (c === 2) sides.push('R');
  return sides;
}

// Same layout as the 3D cube and a real one held yellow up, green in front:
// orange on the right, red on the left, blue at the back
// Red is deep crimson and orange is light, so they differ in lightness too, not just hue
const ICON_FACE_HEX = { U:'#f7c948', F:'#22c55e', R:'#ff9a2e', B:'#3b82f6', L:'#dc1f3c', D:'#e8e8f0' };

// kind: 'oll' shows yellow vs. not-yellow; 'pll' shows real side colors.
// edgesOnly: step-1 OLL, where corners don't matter and are drawn neutral.
function createIconSvg(algStr, kind, edgesOnly, size = 48) {
  const { total, cs } = ICON;
  const sticker = topLayerFor(algStr);
  let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${total} ${total}" xmlns="http://www.w3.org/2000/svg">`;

  for (let r = 0; r < 3; r++)
    for (let c = 0; c < 3; c++) {
      const p = iconCellXY(r, c);
      const isCorner = r !== 1 && c !== 1;
      const neutral = kind === 'oll' && edgesOnly && isCorner;
      const top = sticker(r, c, 'U');
      const cls = neutral || top !== 'U' ? 'oll-gray' : 'oll-yellow';
      svg += `<rect x="${p.x}" y="${p.y}" width="${cs}" height="${cs}" rx="2" class="${cls}"/>`;
      if (neutral) continue;

      outsideSides(r, c).forEach(side => {
        const face = sticker(r, c, side);
        if (kind === 'pll') svg += outsideMarker(r, c, side, null, ICON_FACE_HEX[face]);
        else svg += outsideMarker(r, c, side, face === 'U' ? 'oll-yellow' : 'oll-gray', null);
      });
    }

  svg += '</svg>';
  return svg;
}

//  UI: SIDEBAR
// ═══════════════════════════════════════════

const algListEl = document.getElementById('alg-list');
const tabBtns = document.querySelectorAll('.tab-btn');
let currentTab = 'oll';
let currentAlg = null;
let selectedCard = null;
// Track chosen variant index per alg (keyed by name)
const chosenVariants = {};

function variantIdx(alg) {
  return chosenVariants[alg.name] ?? defaultVariant(alg);
}

function getAlgString(alg) {
  return alg.variants[variantIdx(alg)].alg;
}

function caseBadge(alg, focus) {
  if (!isIncluded(alg)) return '<span class="badge off">Not in scrambles</span>';
  if (focus.slow.has(alg)) return '<span class="badge slow">Slowest</span>';
  if (focus.reps.has(alg)) return `<span class="badge reps">Needs reps ${focus.stats.get(alg).count}/${MIN_SOLVES}</span>`;
  return '';
}

function caseStatsText(st) {
  if (!st.count) return 'No timed solves yet';
  return `avg ${fmtTime(st.avg)} · best ${fmtTime(st.best)} · ${st.count}×`;
}

// "Work on" summary at the top of the list
function renderFocusBanner(focus) {
  const banner = document.createElement('div');
  banner.id = 'focus-banner';
  const names = set => [...set].map(a => a.name.replace(/ \(.*\)/, ''));
  const parts = [];
  if (focus.slow.size) parts.push(`Slowest: <b>${names(focus.slow).join(', ')}</b>`);
  if (focus.reps.size) parts.push(`Needs reps: <b>${focus.reps.size}</b> case${focus.reps.size > 1 ? 's' : ''}`);
  banner.innerHTML = parts.join('<br>');
  algListEl.appendChild(banner);
}

function renderList() {
  const scroll = algListEl.scrollTop;
  algListEl.innerHTML = '';
  const focus = focusFor(currentTab);
  renderFocusBanner(focus);
  ALGS_BY_TAB[currentTab].forEach(section => {
    const title = document.createElement('div');
    title.className = 'alg-section-title';
    title.textContent = section.section;
    algListEl.appendChild(title);

    section.algs.forEach(alg => {
      const card = document.createElement('div');
      card.className = 'alg-card';
      card.dataset.algName = alg.name;
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      const varIdx = variantIdx(alg);
      const isPll = currentTab === 'pll';
      const svgHtml = createIconSvg(alg.variants[varIdx].alg, currentTab, section.edgesOnly);

      let variantsHtml = '<div class="alg-variants">';
      alg.variants.forEach((v, i) => {
        const cls = i === varIdx
          ? (isPll ? 'variant-btn active pll-active' : 'variant-btn active')
          : 'variant-btn';
        variantsHtml += `<button class="${cls}" data-vidx="${i}">${isFavorite(alg, i) ? '★ ' : ''}${v.label}</button>`;
      });
      variantsHtml += `<button class="fav-btn" data-act="fav"></button></div>`;

      if (!isIncluded(alg)) card.classList.add('excluded');
      card.innerHTML = `
        <div class="alg-mini-cube">${svgHtml}</div>
        <div class="alg-info">
          <div class="alg-name-row">
            <div class="alg-name">${alg.name}</div>
            ${caseBadge(alg, focus)}
          </div>
          <div class="alg-moves">${alg.variants[varIdx].alg}</div>
          ${variantsHtml}
          <div class="case-foot">
            <div class="case-stats">${caseStatsText(focus.stats.get(alg) || caseStats(alg))}</div>
            <button class="chip-btn time" data-act="time" title="Timer with scrambles for this case only">⏱ Time it</button>
            <button class="chip-btn" data-act="mix" title="Use this case in random scrambles">${isIncluded(alg) ? '✓ In mix' : '○ Off'}</button>
          </div>
        </div>`;

      // Click card body → select this alg
      card.addEventListener('click', (e) => {
        if (e.target.closest('.variant-btn, .chip-btn, .fav-btn')) return;
        selectAlg(alg, card);
      });

      // Star the selected variant as this case's default (tap again to clear)
      const favBtn = card.querySelector('[data-act=fav]');
      const syncFav = () => {
        const on = isFavorite(alg, variantIdx(alg));
        favBtn.textContent = on ? '★' : '☆';
        favBtn.classList.toggle('on', on);
        favBtn.title = on ? 'Default variant for this case (tap to clear)' : 'Make the selected variant the default for this case';
        card.querySelectorAll('.variant-btn').forEach((b, j) => {
          b.textContent = (isFavorite(alg, j) ? '★ ' : '') + alg.variants[j].label;
        });
      };
      syncFav();
      favBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const vi = variantIdx(alg);
        if (isFavorite(alg, vi)) delete store.favorites[alg.key];
        else store.favorites[alg.key] = slug(alg.variants[vi].label);
        chosenVariants[alg.name] = vi;
        saveStore();
        syncFav();
      });

      card.querySelector('[data-act=time]').addEventListener('click', (e) => {
        e.stopPropagation();
        startTrainer({ mode: alg.tab, focus: alg });
      });

      // Toggle whether random scrambles may use this case
      card.querySelector('[data-act=mix]').addEventListener('click', (e) => {
        e.stopPropagation();
        if (isIncluded(alg)) store.excluded[alg.key] = true;
        else delete store.excluded[alg.key];
        saveStore();
        renderList();
        if (trainer.active && !trainer.focus) newScramble();
      });

      card.addEventListener('keydown', (e) => {
        if (e.target === card && (e.key === 'Enter' || e.key === ' ')) {
          e.preventDefault();
          selectAlg(alg, card);
        }
      });

      // Click variant button → switch variant
      card.querySelectorAll('.variant-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const vi = parseInt(btn.dataset.vidx);
          chosenVariants[alg.name] = vi;
          // Update moves display and icon on this card
          card.querySelector('.alg-moves').textContent = alg.variants[vi].alg;
          card.querySelector('.alg-mini-cube').innerHTML = createIconSvg(alg.variants[vi].alg, currentTab, section.edgesOnly);
          // Update variant buttons
          card.querySelectorAll('.variant-btn').forEach((b, j) => {
            b.className = j === vi
              ? (isPll ? 'variant-btn active pll-active' : 'variant-btn active')
              : 'variant-btn';
          });
          syncFav();
          // If this is the currently selected alg, reload it
          if (selectedCard === card) {
            selectAlg(alg, card);
          }
        });
      });

      if (alg === currentAlg) {
        card.classList.add('selected');
        if (isPll) card.classList.add('pll-selected');
        selectedCard = card;
      }

      algListEl.appendChild(card);
    });
  });
  algListEl.scrollTop = scroll;
}

function switchTab(tab) {
  tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  currentTab = tab;
  selectedCard = null;
  algListEl.scrollTop = 0;
  renderList();
}

tabBtns.forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

// Timer session state (logic lives under TIMER)
const trainer = { active: false, mode: 'oll', focus: null, item: null, state: 'idle', holdTimeout: 0, start: 0, raf: 0, hint: false };

renderList();

// ═══════════════════════════════════════════
//  THREE.JS CUBE
// ═══════════════════════════════════════════

const container = document.getElementById('cube-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setClearColor(0x0c0c0f, 1);
container.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight.position.set(5, 8, 6);
scene.add(dirLight);
const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.2);
dirLight2.position.set(-4, 2, -3);
scene.add(dirLight2);

// Colors
const COLORS = {
  U: 0xFFD500,  // yellow (top)
  D: 0xFFFFFF,  // white  (bottom)
  F: 0x009B48,  // green  (front)
  B: 0x0045AD,  // blue   (back)
  R: 0xFF5900,  // orange (right)
  L: 0xB90000,  // red    (left)
  X: 0x111111,  // internal face
  G: 0x1e1e2a   // ghost (non-relevant pieces)
};

const cubies = [];
const cubeGroup = new THREE.Group();
scene.add(cubeGroup);

let displayMode = 'full'; // 'full', 'oll', 'pll'
let buildGen = 0; // bumped on every rebuild so in-flight animations can bail out
let stepQueue = 0; // Step/Back taps received while a move animates (+ forward, − back)

// ── Geometry constants ──
const BODY_SIZE = 0.93;
const GAP = 0.06;
const STEP = BODY_SIZE + GAP;
const STICKER_SIZE = 0.76;
const STICKER_OFFSET = BODY_SIZE / 2 + 0.003;

// ── Create a rounded box by shrinking a box and adding rounded-edge look ──
// We modify the vertices of a BoxGeometry to push corners/edges inward
function createRoundedBody(size, r, segs) {
  const geo = new THREE.BoxGeometry(size, size, size, segs, segs, segs);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  const half = size / 2;
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    // For each vertex, clamp the inner box and push outward
    const ix = Math.max(-half + r, Math.min(half - r, v.x));
    const iy = Math.max(-half + r, Math.min(half - r, v.y));
    const iz = Math.max(-half + r, Math.min(half - r, v.z));
    const dir = new THREE.Vector3(v.x - ix, v.y - iy, v.z - iz);
    const len = dir.length();
    if (len > 0.0001) {
      dir.normalize().multiplyScalar(r);
      v.set(ix + dir.x, iy + dir.y, iz + dir.z);
    }
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

const bodyGeo = createRoundedBody(BODY_SIZE, 0.06, 4);
const stickerGeo = new THREE.PlaneGeometry(STICKER_SIZE, STICKER_SIZE);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.9, metalness: 0 });
const ghostBodyMat = new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.9, metalness: 0 });

// One shared material per sticker colour (rebuilding the cube used to leak 54 each time)
const stickerMats = new Map();
function stickerMat(color) {
  if (!stickerMats.has(color))
    stickerMats.set(color, new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0, side: THREE.DoubleSide }));
  return stickerMats.get(color);
}

function getCubieColors(x, y, z) {
  // Returns [+x, -x, +y, -y, +z, -z] colors, null = no sticker
  if (displayMode === 'oll') {
    if (y === 1) {
      return [
        x === 1 ? COLORS.G : null,
        x === -1 ? COLORS.G : null,
        COLORS.U,
        null,
        z === 1 ? COLORS.G : null,
        z === -1 ? COLORS.G : null,
      ];
    }
    return [null, null, null, null, null, null];
  }
  if (displayMode === 'pll') {
    if (y === 1) {
      return [
        x === 1 ? COLORS.R : null,
        x === -1 ? COLORS.L : null,
        COLORS.U,
        null,
        z === 1 ? COLORS.F : null,
        z === -1 ? COLORS.B : null,
      ];
    }
    return [null, null, null, null, null, null];
  }
  return [
    x === 1 ? COLORS.R : null,
    x === -1 ? COLORS.L : null,
    y === 1 ? COLORS.U : null,
    y === -1 ? COLORS.D : null,
    z === 1 ? COLORS.F : null,
    z === -1 ? COLORS.B : null,
  ];
}

// Face placement: position + quaternion for each of the 6 faces
const FACE_DEFS = [
  { pos: [STICKER_OFFSET, 0, 0], rot: [0, Math.PI / 2, 0] },   // +x
  { pos: [-STICKER_OFFSET, 0, 0], rot: [0, -Math.PI / 2, 0] },  // -x
  { pos: [0, STICKER_OFFSET, 0], rot: [-Math.PI / 2, 0, 0] },   // +y
  { pos: [0, -STICKER_OFFSET, 0], rot: [Math.PI / 2, 0, 0] },   // -y
  { pos: [0, 0, STICKER_OFFSET], rot: [0, 0, 0] },              // +z
  { pos: [0, 0, -STICKER_OFFSET], rot: [0, Math.PI, 0] },       // -z
];

function buildCube() {
  buildGen++;
  stepQueue = 0;
  while (cubeGroup.children.length) cubeGroup.remove(cubeGroup.children[0]);
  while (pivot.children.length) pivot.remove(pivot.children[0]);
  pivot.rotation.set(0, 0, 0);
  cubies.length = 0;

  for (let x = -1; x <= 1; x++) {
    for (let y = -1; y <= 1; y++) {
      for (let z = -1; z <= 1; z++) {
        if (x === 0 && y === 0 && z === 0) continue;

        const group = new THREE.Group();
        group.position.set(x * STEP, y * STEP, z * STEP);
        group.userData = { lx: x, ly: y, lz: z };

        const isGhost = displayMode !== 'full' && y !== 1;

        // Dark body
        const body = new THREE.Mesh(bodyGeo, isGhost ? ghostBodyMat : bodyMat);
        group.add(body);

        // Colored stickers
        const colors = getCubieColors(x, y, z);
        colors.forEach((col, fi) => {
          if (col === null) return;
          const sticker = new THREE.Mesh(stickerGeo, stickerMat(col));
          const fd = FACE_DEFS[fi];
          sticker.position.set(...fd.pos);
          sticker.rotation.set(...fd.rot);
          group.add(sticker);
        });

        cubeGroup.add(group);
        cubies.push(group);
      }
    }
  }
}

const pivot = new THREE.Group();
scene.add(pivot);

buildCube();

// ═══════════════════════════════════════════
//  ORBIT CONTROLS (simple mouse drag)
// ═══════════════════════════════════════════

const activePointers = new Map(); // pointerId → last {x, y}
let pinchDist = 0;

// Compute a radius so the cube fits nicely with padding
function computeFitRadius() {
  const cubeHalfSize = 1.8; // ~visible half-extent of the 3x3 cube
  const fovRad = THREE.MathUtils.degToRad(camera.fov / 2);
  const aspect = container.clientWidth / container.clientHeight;
  const rVert = cubeHalfSize / Math.sin(fovRad);
  const rHoriz = cubeHalfSize / (Math.sin(fovRad) * aspect);
  return Math.max(rVert, rHoriz) * 1.45; // 45% padding
}

// Standard "in hand" view: see U (top), F (front), R (right) clearly
// This is the correct angle for executing R U F moves visually
const HOME_THETA = 0.62;  // ~35° from front — shows F and R faces
const HOME_PHI = 0.48;    // ~27° above — shows U face prominently

let spherical = { theta: HOME_THETA, phi: HOME_PHI, radius: computeFitRadius() };

function updateCamera() {
  camera.position.set(
    spherical.radius * Math.cos(spherical.phi) * Math.sin(spherical.theta),
    spherical.radius * Math.sin(spherical.phi),
    spherical.radius * Math.cos(spherical.phi) * Math.cos(spherical.theta)
  );
  camera.lookAt(0, 0, 0);
}

function resetCameraPosition(animate = true) {
  const targetTheta = HOME_THETA;
  const targetPhi = HOME_PHI;
  const targetRadius = computeFitRadius();

  if (!animate) {
    spherical.theta = targetTheta;
    spherical.phi = targetPhi;
    spherical.radius = targetRadius;
    updateCamera();
    return;
  }

  const startTheta = spherical.theta;
  const startPhi = spherical.phi;
  const startRadius = spherical.radius;
  const duration = 350;
  const startTime = performance.now();

  function tick() {
    const t = Math.min((performance.now() - startTime) / duration, 1);
    const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    spherical.theta = startTheta + (targetTheta - startTheta) * ease;
    spherical.phi = startPhi + (targetPhi - startPhi) * ease;
    spherical.radius = startRadius + (targetRadius - startRadius) * ease;
    updateCamera();
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

updateCamera();

function clampRadius(r) { return Math.max(4, Math.min(30, r)); }

function pointerSpread() {
  const [a, b] = [...activePointers.values()];
  return Math.hypot(a.x - b.x, a.y - b.y);
}

container.addEventListener('pointerdown', e => {
  container.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activePointers.size === 2) pinchDist = pointerSpread();
});
container.addEventListener('pointermove', e => {
  const prev = activePointers.get(e.pointerId);
  if (!prev) return;
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activePointers.size === 1) {
    spherical.theta -= (e.clientX - prev.x) * 0.008;
    spherical.phi = Math.max(-1.2, Math.min(1.2, spherical.phi + (e.clientY - prev.y) * 0.008));
  } else if (activePointers.size === 2) {
    const d = pointerSpread();
    if (pinchDist > 0 && d > 0) spherical.radius = clampRadius(spherical.radius * pinchDist / d);
    pinchDist = d;
  }
  updateCamera();
});
const releasePointer = e => { activePointers.delete(e.pointerId); pinchDist = 0; };
container.addEventListener('pointerup', releasePointer);
container.addEventListener('pointercancel', releasePointer);

// Scroll to zoom
container.addEventListener('wheel', e => {
  e.preventDefault();
  spherical.radius = clampRadius(spherical.radius + e.deltaY * 0.01);
  updateCamera();
}, { passive: false });

// ═══════════════════════════════════════════
//  MOVE SYSTEM
// ═══════════════════════════════════════════

function getCubiesForMove(axis, layers) {
  const key = axis === 'x' ? 'lx' : axis === 'y' ? 'ly' : 'lz';
  return cubies.filter(c => layers.includes(c.userData[key]));
}

// Returns { axis, layers[], angle }
function parseMove(token) {
  const moves = {
    'R':  { axis:'x', layers:[1],      angle: -Math.PI/2 },
    'L':  { axis:'x', layers:[-1],     angle:  Math.PI/2 },
    'U':  { axis:'y', layers:[1],      angle: -Math.PI/2 },
    'D':  { axis:'y', layers:[-1],     angle:  Math.PI/2 },
    'F':  { axis:'z', layers:[1],      angle: -Math.PI/2 },
    'B':  { axis:'z', layers:[-1],     angle:  Math.PI/2 },
    'M':  { axis:'x', layers:[0],      angle:  Math.PI/2 },
    'E':  { axis:'y', layers:[0],      angle:  Math.PI/2 },
    'S':  { axis:'z', layers:[0],      angle: -Math.PI/2 },
    'r':  { axis:'x', layers:[1,0],    angle: -Math.PI/2 },
    'l':  { axis:'x', layers:[-1,0],   angle:  Math.PI/2 },
    'u':  { axis:'y', layers:[1,0],    angle: -Math.PI/2 },
    'd':  { axis:'y', layers:[-1,0],   angle:  Math.PI/2 },
    'f':  { axis:'z', layers:[1,0],    angle: -Math.PI/2 },
    'b':  { axis:'z', layers:[-1,0],   angle:  Math.PI/2 },
    'x':  { axis:'x', layers:[-1,0,1], angle: -Math.PI/2 },
    'y':  { axis:'y', layers:[-1,0,1], angle: -Math.PI/2 },
    'z':  { axis:'z', layers:[-1,0,1], angle: -Math.PI/2 },
  };

  let base = token[0];
  let rest = token.slice(1);
  let move = moves[base];
  if (!move) return null;

  let { axis, layers, angle } = move;
  layers = [...layers];

  if (rest.includes("'")) angle = -angle;
  if (rest.includes('2')) angle *= 2;

  return { axis, layers, angle };
}

function tokenize(algStr) {
  const tokens = [];
  const re = /([RLUDFBMESxyz]|[rludfb])['2]?/g;
  let m;
  while ((m = re.exec(algStr)) !== null) tokens.push(m[0]);
  return tokens;
}

// ═══════════════════════════════════════════
//  ANIMATION ENGINE
// ═══════════════════════════════════════════

let animating = false;

function roundPos(v) {
  return Math.round(v * 10) / 10;
}

function animateMove(move, duration) {
  return new Promise(resolve => {
    if (!move) { resolve(); return; }

    const gen = buildGen;
    const affected = getCubiesForMove(move.axis, move.layers);
    const axisVec = new THREE.Vector3(
      move.axis === 'x' ? 1 : 0,
      move.axis === 'y' ? 1 : 0,
      move.axis === 'z' ? 1 : 0
    );

    // Move cubies to pivot
    pivot.rotation.set(0, 0, 0);
    pivot.updateMatrixWorld();
    affected.forEach(c => {
      cubeGroup.remove(c);
      pivot.add(c);
    });

    const startAngle = 0;
    const endAngle = move.angle;
    const startTime = performance.now();

    function tick() {
      // Cube was rebuilt mid-move: buildCube already discarded these cubies
      if (gen !== buildGen) { resolve(); return; }
      const elapsed = performance.now() - startTime;
      const t = Math.min(elapsed / duration, 1);
      // Ease in-out
      const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const currentAngle = startAngle + (endAngle - startAngle) * eased;

      if (move.axis === 'x') pivot.rotation.x = currentAngle;
      else if (move.axis === 'y') pivot.rotation.y = currentAngle;
      else pivot.rotation.z = currentAngle;

      if (t < 1) {
        requestAnimationFrame(tick);
      } else {
        // Finalize: bake rotation into cubies, move back
        pivot.updateMatrixWorld();
        affected.forEach(c => {
          // Get world position/rotation
          const wp = new THREE.Vector3();
          c.getWorldPosition(wp);
          const wq = new THREE.Quaternion();
          c.getWorldQuaternion(wq);

          pivot.remove(c);
          c.position.copy(wp);
          c.quaternion.copy(wq);
          cubeGroup.add(c);

          // Update logical position
          const lp = new THREE.Vector3(c.userData.lx, c.userData.ly, c.userData.lz);
          // Rotate logical position
          const q = new THREE.Quaternion().setFromAxisAngle(axisVec, endAngle);
          lp.applyQuaternion(q);
          c.userData.lx = Math.round(lp.x);
          c.userData.ly = Math.round(lp.y);
          c.userData.lz = Math.round(lp.z);
        });

        pivot.rotation.set(0, 0, 0);
        resolve();
      }
    }
    requestAnimationFrame(tick);
  });
}

// ═══════════════════════════════════════════
//  PLAYER LOGIC
// ═══════════════════════════════════════════

let moveTokens = [];
let moveIndex = 0;
let playing = false;

const algDisplay = document.getElementById('alg-display');
const btnPlay = document.getElementById('btn-play');
const btnStep = document.getElementById('btn-step');
const btnBack = document.getElementById('btn-back');
const btnReset = document.getElementById('btn-reset');
const speedSlider = document.getElementById('speed');
const placeholder = document.getElementById('placeholder');
const mainEl = document.getElementById('main');
const modalCloseBtn = document.getElementById('modal-close');
const modalAlgName = document.getElementById('modal-alg-name');

function isMobile() { return window.innerWidth <= 700; }

function openMobileModal(url) {
  if (!mainEl.classList.contains('modal-open')) history.pushState({ modal: true }, '', url);
  else if (url) history.replaceState(history.state, '', url);
  document.body.classList.add('modal-lock');
  mainEl.classList.add('modal-open');
  // Resize renderer after CSS transition
  setTimeout(resizeRenderer, 50);
  setTimeout(resizeRenderer, 350);
}

function closeMobileModal() {
  mainEl.classList.remove('modal-open');
  document.body.classList.remove('modal-lock');
  playing = false;
  if (trainer.active) closeTrainer();
  updateButtons();
}

// Camera to the home view; on phones, after the modal's slide-in settles
function settleCamera() {
  if (isMobile()) {
    setTimeout(() => resetCameraPosition(false), 100);
    setTimeout(() => resetCameraPosition(false), 400);
  } else {
    resetCameraPosition(true);
  }
}

modalCloseBtn.addEventListener('click', () => {
  if (history.state?.modal) history.back(); // popstate closes it
  else closeMobileModal();
});
window.addEventListener('popstate', () => {
  if (mainEl.classList.contains('modal-open')) closeMobileModal();
});

function resizeRenderer() {
  if (!container.clientWidth || !container.clientHeight) return;
  const zoom = spherical.radius / computeFitRadius();
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
  spherical.radius = clampRadius(computeFitRadius() * zoom);
  updateCamera();
}

function getMoveDuration() {
  const v = parseInt(speedSlider.value);
  return 600 - (v - 1) * 55; // 600ms to 105ms
}

function updateDisplay() {
  if (!moveTokens.length) { algDisplay.innerHTML = ''; return; }
  let html = '';
  moveTokens.forEach((tok, i) => {
    const cls = i < moveIndex ? 'done' : i === moveIndex ? 'current' : 'pending';
    html += `<span class="${cls}" data-step="${i}">${tok}</span> `;
  });
  algDisplay.innerHTML = html;

  // Attach click handlers
  algDisplay.querySelectorAll('span[data-step]').forEach(span => {
    span.addEventListener('click', () => {
      const target = parseInt(span.dataset.step);
      goToStep(target);
    });
  });

  const cur = algDisplay.querySelector('.current');
  if (cur && algDisplay.scrollWidth > algDisplay.clientWidth) {
    algDisplay.scrollTo({ left: cur.offsetLeft - (algDisplay.clientWidth - cur.offsetWidth) / 2, behavior: 'smooth' });
  }
}

async function goToStep(targetIndex) {
  if (animating || targetIndex === moveIndex) return;
  playing = false;
  stepQueue = 0;
  animating = true;
  updateButtons();

  const fastDuration = Math.min(getMoveDuration(), 200);

  const gen = buildGen;
  if (targetIndex > moveIndex) {
    // Animate forward
    while (moveIndex < targetIndex && moveIndex < moveTokens.length) {
      const move = parseMove(moveTokens[moveIndex]);
      await animateMove(move, fastDuration);
      if (gen !== buildGen) return;
      moveIndex++;
      updateDisplay();
    }
  } else {
    // Animate backward
    while (moveIndex > targetIndex) {
      moveIndex--;
      const tok = moveTokens[moveIndex];
      let inverseTok;
      if (tok.endsWith("'")) inverseTok = tok.slice(0, -1);
      else if (tok.endsWith('2')) inverseTok = tok;
      else inverseTok = tok + "'";
      const move = parseMove(inverseTok);
      await animateMove(move, fastDuration);
      if (gen !== buildGen) return;
      updateDisplay();
    }
  }

  animating = false;
  updateDisplay();
  updateButtons();
}

// Buttons stay enabled while a move animates: a tap on a disabled button
// falls through to the page, which iOS treats as a double-tap zoom.
function updateButtons() {
  const done = !!currentAlg && moveIndex >= moveTokens.length;
  btnPlay.disabled = !currentAlg;
  btnStep.disabled = !currentAlg || done;
  btnBack.disabled = !currentAlg || moveIndex === 0;
  btnReset.disabled = !currentAlg;
  btnPlay.innerHTML = playing ? '⏸ Pause' : (done ? '▶ Replay' : '▶ Play');
}

function drainStepQueue() {
  if (playing || animating || !stepQueue) return;
  if (stepQueue > 0) { stepQueue--; doStep(); }
  else { stepQueue++; doStepBack(); }
}

async function doStepBack() {
  if (animating) { if (!playing) stepQueue--; return; }
  if (moveIndex <= 0) { stepQueue = 0; return; }
  animating = true;
  playing = false;
  updateButtons();

  moveIndex--;
  // Apply the inverse of the move we're undoing
  const tok = moveTokens[moveIndex];
  let inverseTok;
  if (tok.endsWith("'")) inverseTok = tok.slice(0, -1);
  else if (tok.endsWith('2')) inverseTok = tok;
  else inverseTok = tok + "'";

  const gen = buildGen;
  const move = parseMove(inverseTok);
  await animateMove(move, getMoveDuration());
  if (gen !== buildGen) return;
  animating = false;
  updateDisplay();
  updateButtons();
  drainStepQueue();
}

async function doStep() {
  if (animating) { if (!playing) stepQueue++; return; }
  if (moveIndex >= moveTokens.length) { stepQueue = 0; return; }
  animating = true;
  updateButtons();

  const gen = buildGen;
  const move = parseMove(moveTokens[moveIndex]);
  await animateMove(move, getMoveDuration());
  if (gen !== buildGen) return;
  moveIndex++;
  animating = false;
  updateDisplay();
  updateButtons();
  drainStepQueue();
}

async function playAll() {
  if (moveIndex >= moveTokens.length) {
    // Reset first for replay
    resetCube();
    await new Promise(r => setTimeout(r, 200));
  }
  playing = true;
  stepQueue = 0;
  updateButtons();
  while (playing && moveIndex < moveTokens.length) {
    // A Step may still be finishing when Play is pressed
    if (animating) { await new Promise(r => setTimeout(r, 30)); continue; }
    await doStep();
    if (moveIndex < moveTokens.length) await new Promise(r => setTimeout(r, 80));
  }
  playing = false;
  updateButtons();
}

function resetCube() {
  playing = false;
  animating = false;
  moveTokens = tokenize(getAlgString(currentAlg));
  moveIndex = 0;
  buildCube();
  applySetup();
  resetCameraPosition(true);
  updateDisplay();
  updateButtons();
}

function applySetup() {
  // Apply the inverse of the algorithm instantly so the cube shows the OLL/PLL case
  const inverse = getInverse(moveTokens);
  inverse.forEach(tok => {
    const move = parseMove(tok);
    if (!move) return;
    const affected = getCubiesForMove(move.axis, move.layers);
    const axisVec = new THREE.Vector3(
      move.axis === 'x' ? 1 : 0,
      move.axis === 'y' ? 1 : 0,
      move.axis === 'z' ? 1 : 0
    );
    const q = new THREE.Quaternion().setFromAxisAngle(axisVec, move.angle);

    affected.forEach(c => {
      // Rotate position
      c.position.applyQuaternion(q);
      c.position.x = Math.round(c.position.x * 100) / 100;
      c.position.y = Math.round(c.position.y * 100) / 100;
      c.position.z = Math.round(c.position.z * 100) / 100;
      // Rotate orientation
      c.quaternion.premultiply(q);
      // Update logical
      const lp = new THREE.Vector3(c.userData.lx, c.userData.ly, c.userData.lz);
      lp.applyQuaternion(q);
      c.userData.lx = Math.round(lp.x);
      c.userData.ly = Math.round(lp.y);
      c.userData.lz = Math.round(lp.z);
    });
  });
}

function getInverse(tokens) {
  return [...tokens].reverse().map(tok => {
    if (tok.endsWith("'")) return tok.slice(0, -1);
    if (tok.endsWith('2')) return tok;
    return tok + "'";
  });
}

function selectAlg(alg, cardEl) {
  exitTrainer();
  if (selectedCard) selectedCard.classList.remove('selected', 'pll-selected');
  cardEl.classList.add('selected');
  if (currentTab === 'pll') cardEl.classList.add('pll-selected');
  selectedCard = cardEl;

  placeholder.style.display = 'none';
  currentAlg = alg;
  displayMode = currentTab; // 'oll' or 'pll'
  moveTokens = tokenize(getAlgString(alg));
  moveIndex = 0;
  playing = false;
  animating = false;

  buildCube();
  applySetup();
  updateDisplay();
  updateButtons();

  const link = linkFor(alg, variantIdx(alg));
  store.last = link;
  saveStore();

  // Mobile: open modal, then reset camera after layout settles
  if (isMobile()) {
    modalAlgName.textContent = alg.name;
    openMobileModal(link);
  } else {
    history.replaceState(history.state, '', link);
  }
  settleCamera();
}

// ═══════════════════════════════════════════
//  TIMER
// ═══════════════════════════════════════════
// Gives a scramble for a solved physical cube that sets up a random last-layer
// case, then times the solve: hold 0.5s (red → green), release to start,
// tap anywhere to stop. Solves are stored per mode and per starting case.

const trainerEl = document.getElementById('trainer');
const trScrambleEl = document.getElementById('tr-scramble');
const trTimeEl = document.getElementById('tr-time');
const trHelpEl = document.getElementById('tr-help');
const trHintEl = document.getElementById('tr-hint');
const trShowBtn = document.getElementById('tr-show');
const trFocusBtn = document.getElementById('tr-focus');
const trStatsEl = document.getElementById('tr-stats');
const trRecentEl = document.getElementById('tr-recent');
const MODE_LABEL = { oll: 'OLL', ll: 'OLL + PLL', pll: 'PLL' };
const HOLD_MS = 500;
const AUFS = ['', 'U', 'U2', "U'"];

const pick = xs => xs[Math.floor(Math.random() * xs.length)];
const randomAuf = () => { const a = pick(AUFS); return a ? [a] : []; };

// Scrambles use only face turns, so they're easy to apply by hand
const FACE_TURN = /^[RUFLDB]['2]?$/;
function faceTurnAlg(alg) {
  const faceOnly = alg.variants.filter(v => tokenize(v.alg).every(t => FACE_TURN.test(t)));
  return tokenize(pick(faceOnly.length ? faceOnly : alg.variants).alg);
}

// Merge consecutive turns of the same face (U U2 → U', R R' → nothing)
function simplify(tokens) {
  const QUARTERS = { '': 1, '2': 2, "'": 3 };
  const out = [];
  tokens.forEach(tok => {
    const last = out[out.length - 1];
    if (last && last[0] === tok[0]) {
      const q = (QUARTERS[last.slice(1)] + QUARTERS[tok.slice(1)]) % 4;
      out.pop();
      if (q) out.push(tok[0] + ['', '', '2', "'"][q]);
    } else {
      out.push(tok);
    }
  });
  return out;
}

const casesOf = (tab, step) => ALGS_BY_TAB[tab][step - 1].algs;

// Random starting case for a tab, weighted toward cases that need work
function pickTarget(tab) {
  if (trainer.focus && trainer.focus.tab === tab) return trainer.focus;
  const all = ALGS_BY_TAB[tab].flatMap(section => section.algs);
  let pool = all.filter(isIncluded);
  if (!pool.length) pool = all;
  const last = trainer.item?.targets.find(t => t.tab === tab);
  if (pool.length > 1) pool = pool.filter(a => a !== last);
  const focus = focusFor(tab);
  const weight = a => (focus.slow.has(a) || focus.reps.has(a) ? 3 : 1);
  let r = Math.random() * pool.reduce((sum, a) => sum + weight(a), 0);
  return pool.find(a => (r -= weight(a)) < 0) || pool[pool.length - 1];
}

// One way to solve a tab's part starting from `target`: a first-look target
// is followed by a random second-look case (or a skip) from the scramble mix
function solvePart(target) {
  const tokens = [...randomAuf(), ...faceTurnAlg(target), ...randomAuf()];
  if (target.step === 1) {
    const second = casesOf(target.tab, 2).filter(isIncluded);
    const next = pick([null, ...(second.length ? second : casesOf(target.tab, 2))]);
    if (next) tokens.push(...faceTurnAlg(next), ...randomAuf());
  }
  return tokens;
}

function makeItem(mode) {
  const targets = mode === 'll' ? [pickTarget('oll'), pickTarget('pll')] : [pickTarget(mode)];
  const solution = targets.flatMap(solvePart);
  return { mode, targets, solution, scramble: simplify(getInverse(solution)) };
}

function newScramble() {
  trainer.item = makeItem(trainer.mode);
  trScrambleEl.textContent = trainer.item.scramble.join(' ');
  setHint(false);
}

// "Show case": the last layer you should see after scrambling, as seen from above
function setHint(on) {
  trainer.hint = on;
  trShowBtn.textContent = on ? 'Hide case' : 'Show case';
  trHintEl.classList.toggle('on', on);
  if (!on) return;
  const { mode, targets, solution } = trainer.item;
  const kind = mode === 'pll' ? 'pll' : 'oll';
  const first = targets[0];
  trHintEl.innerHTML = `
    ${createIconSvg(solution.join(' '), kind, false, 72)}
    <div>
      <div class="name">${first.name}${first.step === 1 ? ' <span style="color:var(--text-dim)">(first look)</span>' : ''}</div>
      <div class="alg">${first.variants[defaultVariant(first)].alg}</div>
      ${mode === 'll' ? '<div class="alg">…then PLL</div>' : ''}
    </div>`;
}

function setMode(mode) {
  trainer.mode = mode;
  if (trainer.focus && trainer.focus.tab !== mode) trainer.focus = null;
  store.mode = mode;
  saveStore();
  document.querySelectorAll('#tr-mode button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  trFocusBtn.classList.toggle('on', !!trainer.focus);
  trFocusBtn.textContent = trainer.focus ? `Only ${trainer.focus.name}  ✕` : '';
  history.replaceState(history.state, '', `#timer/${mode}` + (trainer.focus ? `/${slug(trainer.focus.name)}` : ''));
  newScramble();
  renderTrainerStats();
}

function renderTrainerStats() {
  const solves = store.solves.filter(sv => sv.mode === trainer.mode);
  const times = solves.map(sv => sv.ms);
  const cell = (label, v) => `<div class="stat"><div class="tr-label">${label}</div><div class="v">${v == null ? '–' : fmtTime(v)}</div></div>`;
  trStatsEl.innerHTML = cell('Best', times.length ? Math.min(...times) : null) + cell('Ao5', aoN(times, 5))
    + cell('Ao12', aoN(times, 12)) + `<div class="stat"><div class="tr-label">Solves</div><div class="v">${times.length}</div></div>`;

  trRecentEl.innerHTML = '';
  solves.slice(-12).reverse().forEach(sv => {
    const row = document.createElement('div');
    row.className = 'solve-row';
    const names = sv.mode === 'll' ? (sv.cases || []).map(k => ALG_BY_KEY[k]?.name).join(' → ') : ALG_BY_KEY[sv.case]?.name;
    row.innerHTML = `<span class="t">${fmtTime(sv.ms)}</span><span class="c">${names || ''}</span><button title="Delete this solve">✕</button>`;
    row.querySelector('button').addEventListener('click', () => {
      store.solves.splice(store.solves.indexOf(sv), 1);
      saveStore();
      renderTrainerStats();
      renderList();
    });
    trRecentEl.appendChild(row);
  });
}

function setTimerState(state) {
  trainer.state = state;
  trainerEl.classList.toggle('holding', state === 'holding');
  trainerEl.classList.toggle('ready', state === 'ready');
  trainerEl.classList.toggle('running', state === 'running');
  mainEl.classList.toggle('timing', state === 'running');
  trHelpEl.textContent = {
    idle: isMobile() ? 'Hold anywhere, release to start' : 'Hold Space (or press here), release to start',
    holding: 'Keep holding…',
    ready: 'Release to start',
    running: '',
  }[state];
}

function pressDown() {
  if (trainer.state === 'running') { stopTimer(); return; }
  if (trainer.state !== 'idle') return;
  setTimerState('holding');
  trainer.holdTimeout = setTimeout(() => {
    if (trainer.state !== 'holding') return;
    trTimeEl.textContent = fmtTime(0);
    setTimerState('ready');
  }, HOLD_MS);
}

function pressUp() {
  clearTimeout(trainer.holdTimeout);
  if (trainer.state === 'ready') startTimer();
  else if (trainer.state === 'holding') setTimerState('idle');
}

function startTimer() {
  setTimerState('running');
  trainer.start = performance.now();
  const tick = () => {
    trTimeEl.textContent = fmtTime(performance.now() - trainer.start);
    trainer.raf = requestAnimationFrame(tick);
  };
  tick();
}

function stopTimer() {
  cancelAnimationFrame(trainer.raf);
  const ms = Math.round(performance.now() - trainer.start);
  trTimeEl.textContent = fmtTime(ms);
  const { mode, targets } = trainer.item;
  store.solves.push(mode === 'll'
    ? { ms, mode, cases: targets.map(t => t.key), at: Date.now() }
    : { ms, mode, case: targets[0].key, at: Date.now() });
  saveStore();
  setTimerState('idle');
  newScramble();
  renderTrainerStats();
  renderList();
}

function startTrainer({ mode = store.mode, focus = null } = {}) {
  if (selectedCard) selectedCard.classList.remove('selected', 'pll-selected');
  selectedCard = null;
  currentAlg = null;
  playing = false;
  trainer.active = true;
  trainer.focus = focus;
  mainEl.classList.add('trainer-mode');
  modalAlgName.textContent = 'Timer';
  if (isMobile()) openMobileModal();
  setTimerState('idle');
  trTimeEl.textContent = fmtTime(0);
  setMode(isTab(mode) || mode === 'll' ? mode : 'oll');
}

// Leave timer state (the caller decides what shows next)
function exitTrainer() {
  if (!trainer.active) return;
  clearTimeout(trainer.holdTimeout);
  cancelAnimationFrame(trainer.raf);
  trainer.active = false;
  setTimerState('idle');
  mainEl.classList.remove('trainer-mode');
}

// Close the timer back to the idle "pick a case" view
function closeTrainer() {
  exitTrainer();
  currentAlg = null;
  moveTokens = [];
  displayMode = 'full';
  buildCube();
  updateDisplay();
  updateButtons();
  placeholder.style.display = '';
  history.replaceState(history.state, '', location.pathname);
}

document.getElementById('btn-timer').addEventListener('click', () => startTrainer());
document.getElementById('tr-exit').addEventListener('click', closeTrainer);
document.getElementById('tr-new').addEventListener('click', newScramble);
trShowBtn.addEventListener('click', () => setHint(!trainer.hint));
trFocusBtn.addEventListener('click', () => { trainer.focus = null; setMode(trainer.mode); });
document.querySelectorAll('#tr-mode button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

// Anywhere on the timer screen (except its buttons) is the pad; while
// running, any touch on the page stops the clock
trainerEl.addEventListener('pointerdown', e => {
  if (trainer.state !== 'running' && e.target.closest('button, #tr-recent')) return;
  e.preventDefault();
  pressDown();
});
window.addEventListener('pointerup', () => { if (trainer.active) pressUp(); });
window.addEventListener('pointercancel', () => { if (trainer.active) pressUp(); });
document.addEventListener('pointerdown', e => {
  if (trainer.state === 'running' && !trainerEl.contains(e.target)) stopTimer();
}, true);
trainerEl.addEventListener('contextmenu', e => e.preventDefault());

// Open a link like #oll/sune, #pll/adj-corner-swap/j-perm-b, #timer/ll or #timer/oll/sune
function openLink(hash) {
  const [tab, algSlug, varSlug] = hash.replace(/^#/, '').split('/');
  if (tab === 'timer') {
    const mode = isTab(algSlug) || algSlug === 'll' ? algSlug : store.mode;
    const focus = (isTab(mode) && ALGS_BY_TAB[mode].flatMap(section => section.algs).find(a => slug(a.name) === varSlug)) || null;
    startTrainer({ mode, focus });
    return;
  }
  if (!isTab(tab)) return;
  switchTab(tab);
  const alg = ALGS_BY_TAB[tab].flatMap(section => section.algs).find(a => slug(a.name) === algSlug);
  if (!alg) return;
  const vi = alg.variants.findIndex(v => slug(v.label) === varSlug);
  if (vi >= 0) chosenVariants[alg.name] = vi;
  renderList();
  const card = [...algListEl.querySelectorAll('.alg-card')].find(c => c.dataset.algName === alg.name);
  selectAlg(alg, card);
  card.scrollIntoView({ block: 'nearest' });
}

btnPlay.addEventListener('click', () => {
  if (playing) { playing = false; updateButtons(); }
  else playAll();
});
btnStep.addEventListener('click', doStep);
btnBack.addEventListener('click', doStepBack);
btnReset.addEventListener('click', resetCube);

// Timer: hold Space, release to start, any key stops
window.addEventListener('keydown', e => {
  if (!trainer.active) return;
  if (trainer.state === 'running') { e.preventDefault(); stopTimer(); return; }
  if (e.key === ' ' && !e.repeat) { e.preventDefault(); document.activeElement?.blur(); pressDown(); }
});
window.addEventListener('keyup', e => {
  if (trainer.active && e.key === ' ') { e.preventDefault(); pressUp(); }
});

// Keyboard: Space = play/pause, ←/→ = step back/forward
window.addEventListener('keydown', e => {
  if (trainer.active || !currentAlg || e.target.closest('button, input, .alg-card')) return;
  if (e.key === ' ') { e.preventDefault(); btnPlay.click(); }
  else if (e.key === 'ArrowRight') doStep();
  else if (e.key === 'ArrowLeft') doStepBack();
});

// ═══════════════════════════════════════════
//  RENDER LOOP
// ═══════════════════════════════════════════

function render() {
  requestAnimationFrame(render);
  // Nothing to draw while the cube is off screen or behind the drill timer
  if (trainer.active || (isMobile() && !mainEl.classList.contains('modal-open'))) return;
  renderer.render(scene, camera);
}
render();

window.addEventListener('resize', resizeRenderer);

// Start from a shared link, else (desktop) reopen the last case
if (location.hash) openLink(location.hash);
else if (!isMobile() && store.last) openLink(store.last);
</script>
</body>
</html>
